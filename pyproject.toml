[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-learning-system"
version = "0.2.0"
description = "Source-grounded medical knowledge graph and adaptive learning system"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "PyYAML>=6.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
rag = ["raganything[all]"]
docling = ["docling>=2.81,<3"]
pdf-native = ["pypdf>=5.9,<7", "pymupdf>=1.26,<2"]
supabase = ["supabase>=2.31,<3"]
google-drive = ["google-api-python-client>=2,<3", "google-auth>=2,<3"]
embedding-local = ["sentence-transformers>=6.1,<7"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
mls-ingest = "medical_learning_system.cli.ingest:main"
mls-query = "medical_learning_system.cli.query:main"
mls-benchmark-score = "medical_learning_system.cli.benchmark_score:main"
mls-evaluate-retrieval = "medical_learning_system.cli.evaluate_retrieval:main"
mls-pilot-ingest = "medical_learning_system.cli.pilot_ingest:main"
mls-compile-source = "medical_learning_system.cli.compile_source:main"
mls-worker-once = "medical_learning_system.cli.worker_once:main"
mls-kg-v5-audit = "medical_learning_system.cli.kg_v5_audit:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
