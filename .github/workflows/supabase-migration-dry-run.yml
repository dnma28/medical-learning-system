name: Supabase migration dry-run

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/supabase-migration-dry-run.yml"
      - "supabase/migrations/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate database connection secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL" || {
            echo "SUPABASE_DB_URL is missing"
            exit 1
          }

          python - <<'PY'
          import os
          from urllib.parse import urlparse

          parsed = urlparse(os.environ["SUPABASE_DB_URL"])
          if parsed.scheme not in {"postgres", "postgresql"}:
              raise SystemExit(
                  "SUPABASE_DB_URL must be a Postgres connection string."
              )
          if not parsed.hostname:
              raise SystemExit("SUPABASE_DB_URL has no database host.")
          if not parsed.username:
              raise SystemExit("SUPABASE_DB_URL has no database username.")
          if not parsed.path or parsed.path == "/":
              raise SystemExit("SUPABASE_DB_URL has no database name.")

          print("Supabase database connection string shape is valid.")
          PY

      - name: Verify pinned Supabase CLI
        shell: bash
        run: npx --yes supabase@2.117.0 --version

      - name: Inspect migration history
        shell: bash
        run: |
          npx --yes supabase@2.117.0 migration list \
            --db-url "$SUPABASE_DB_URL"

      - name: Preview pending migrations only
        shell: bash
        run: |
          npx --yes supabase@2.117.0 db push \
            --db-url "$SUPABASE_DB_URL" \
            --dry-run
