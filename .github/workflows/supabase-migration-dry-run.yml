name: Supabase migration dry-run

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/supabase-migration-dry-run.yml"
      - "supabase/migrations/**"
  pull_request:
    paths:
      - ".github/workflows/supabase-migration-dry-run.yml"
      - "supabase/migrations/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MLS_SUPABASE_URL: ${{ secrets.MLS_SUPABASE_URL }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_POOLER_HOST: aws-0-ap-south-1.pooler.supabase.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build masked Session pooler URL
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MLS_SUPABASE_URL" || {
            echo "MLS_SUPABASE_URL is missing"
            exit 1
          }
          test -n "$SUPABASE_DB_PASSWORD" || {
            echo "SUPABASE_DB_PASSWORD is missing"
            exit 1
          }

          python - <<'PY'
          import os
          from urllib.parse import quote, urlparse

          parsed = urlparse(os.environ["MLS_SUPABASE_URL"])
          host = parsed.hostname or ""
          suffix = ".supabase.co"
          if not host.endswith(suffix):
              raise SystemExit(
                  "MLS_SUPABASE_URL must be the standard Supabase Project URL."
              )

          project_ref = host[: -len(suffix)]
          if not project_ref or not project_ref.isalnum():
              raise SystemExit("Could not derive a valid project ref.")

          pooler_host = os.environ["SUPABASE_POOLER_HOST"].strip()
          if (
              not pooler_host.endswith(".pooler.supabase.com")
              or "://" in pooler_host
              or "/" in pooler_host
              or ":" in pooler_host
          ):
              raise SystemExit("Invalid Supabase Session pooler hostname.")

          password = quote(
              os.environ["SUPABASE_DB_PASSWORD"],
              safe="",
          )
          db_url = (
              f"postgresql://postgres.{project_ref}:{password}"
              f"@{pooler_host}:5432/postgres"
              f"?sslmode=require"
          )

          print(f"::add-mask::{db_url}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"SUPABASE_DB_URL={db_url}\n")

          print("Session pooler migration connection prepared safely.")
          PY

      - name: Verify pinned Supabase CLI
        shell: bash
        run: npx --yes supabase@2.117.0 --version

      - name: Inspect migration history
        shell: bash
        run: |
          npx --yes supabase@2.117.0 migration list \
            --db-url "$SUPABASE_DB_URL"

      - name: Preview pending migrations only
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          npx --yes supabase@2.117.0 db push \
            --db-url "$SUPABASE_DB_URL" \
            --dry-run

      - name: Apply reviewed migrations on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          npx --yes supabase@2.117.0 db push \
            --db-url "$SUPABASE_DB_URL"
