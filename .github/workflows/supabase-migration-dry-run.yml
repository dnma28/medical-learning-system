name: Supabase migration dry-run

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/supabase-migration-dry-run.yml"
      - "supabase/migrations/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      MLS_SUPABASE_URL: ${{ secrets.MLS_SUPABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo "SUPABASE_ACCESS_TOKEN is missing"
            exit 1
          }
          test -n "$SUPABASE_DB_PASSWORD" || {
            echo "SUPABASE_DB_PASSWORD is missing"
            exit 1
          }
          test -n "$MLS_SUPABASE_URL" || {
            echo "MLS_SUPABASE_URL is missing"
            exit 1
          }

      - name: Discover project reference safely
        id: project
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          from urllib.parse import urlparse

          token = os.environ["SUPABASE_ACCESS_TOKEN"]
          request = urllib.request.Request(
              "https://api.supabase.com/v1/projects",
              headers={
                  "Authorization": "Bearer " + token,
                  "Accept": "application/json",
              },
              method="GET",
          )

          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  projects = json.load(response)
          except urllib.error.HTTPError as exc:
              raise SystemExit(
                  f"Supabase Management API authentication failed with HTTP {exc.code}"
              ) from None
          except urllib.error.URLError as exc:
              raise SystemExit(
                  "Supabase Management API was not reachable"
              ) from exc

          if not isinstance(projects, list) or not projects:
              raise SystemExit(
                  "SUPABASE_ACCESS_TOKEN can access no Supabase projects."
              )

          accessible = {
              str(project.get("id", "")).strip()
              for project in projects
              if str(project.get("id", "")).strip()
          }
          if not accessible:
              raise SystemExit(
                  "Supabase Management API returned no usable project IDs."
              )

          parsed = urlparse(os.environ["MLS_SUPABASE_URL"])
          hints = set()
          host = parsed.hostname or ""
          suffix = ".supabase.co"
          if host.endswith(suffix):
              hints.add(host[: -len(suffix)])

          parts = [part for part in parsed.path.split("/") if part]
          for index in range(len(parts) - 2):
              if parts[index:index + 2] == ["dashboard", "project"]:
                  hints.add(parts[index + 2])

          matches = accessible & hints
          if len(matches) == 1:
              project_ref = next(iter(matches))
          elif len(accessible) == 1:
              project_ref = next(iter(accessible))
          elif len(matches) > 1:
              raise SystemExit(
                  "MLS_SUPABASE_URL ambiguously matches multiple accessible projects."
              )
          else:
              raise SystemExit(
                  "Token can access multiple projects and MLS_SUPABASE_URL "
                  "cannot safely disambiguate the deployment target."
              )

          print(f"::add-mask::{project_ref}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"project_ref={project_ref}\n")
          PY

      - name: Verify pinned Supabase CLI
        shell: bash
        run: npx --yes supabase@2.117.0 --version

      - name: Initialize ephemeral Supabase config
        shell: bash
        run: |
          if [ ! -f supabase/config.toml ]; then
            npx --yes supabase@2.117.0 init
          fi

      - name: Link project
        shell: bash
        run: |
          npx --yes supabase@2.117.0 link \
            --project-ref "${{ steps.project.outputs.project_ref }}" \
            --password "$SUPABASE_DB_PASSWORD"

      - name: Inspect migration history
        shell: bash
        run: npx --yes supabase@2.117.0 migration list --linked

      - name: Preview pending migrations only
        shell: bash
        run: |
          npx --yes supabase@2.117.0 db push \
            --dry-run \
            --password "$SUPABASE_DB_PASSWORD"
