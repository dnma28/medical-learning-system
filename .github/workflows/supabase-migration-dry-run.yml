name: Supabase migration dry-run

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/supabase-migration-dry-run.yml"
      - "supabase/migrations/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      MLS_SUPABASE_URL: ${{ secrets.MLS_SUPABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "SUPABASE_ACCESS_TOKEN is missing"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "SUPABASE_DB_PASSWORD is missing"; exit 1; }
          test -n "$MLS_SUPABASE_URL" || { echo "MLS_SUPABASE_URL is missing"; exit 1; }

          project_ref="${MLS_SUPABASE_URL#https://}"
          project_ref="${project_ref%%.supabase.co*}"
          if [[ -z "$project_ref" || "$project_ref" == "$MLS_SUPABASE_URL" || ! "$project_ref" =~ ^[a-z0-9]+$ ]]; then
            echo "MLS_SUPABASE_URL is not a recognized Supabase project URL"
            exit 1
          fi
          echo "SUPABASE_PROJECT_REF=$project_ref" >> "$GITHUB_ENV"

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        shell: bash
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Preview pending migrations only
        shell: bash
        run: supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD"
