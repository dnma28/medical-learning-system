name: Costanzo v4 promote one

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/costanzo-v4-promote-one.yml"

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MLS_SUPABASE_URL: ${{ secrets.MLS_SUPABASE_URL }}
      MLS_SUPABASE_SECRET_KEY: ${{ secrets.MLS_SUPABASE_SECRET_KEY }}

    steps:
      - name: Validate secret presence
        shell: bash
        run: |
          test -n "$MLS_SUPABASE_URL"
          test -n "$MLS_SUPABASE_SECRET_KEY"

      - name: Certify, promote, and verify Costanzo v4
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          LOGICAL = "costanzo-physiology"
          SOURCE_ID = "costanzo-physiology--b21837a317f0"
          SOURCE_SHA = "e71a320ed2c9b4f930dfe45a013255f022a253d4dbf70dee91759937d5ab6e8d"
          SOURCE_SIZE = 16313492
          STAGING_VERSION = 4
          STAGING_SHA = "75be4a219abcfcbc4437d0ed448b282fd51ee05af8c2a16b782c9df6eb410fe6"
          TOC_DENOMINATOR = 894
          EXPECTED_RUNTIME_NODES = 895
          EXPECTED_VERSION = 0

          base = os.environ["MLS_SUPABASE_URL"].rstrip("/")
          key = os.environ["MLS_SUPABASE_SECRET_KEY"]

          def request(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(
                  base + path,
                  data=data,
                  method=method,
                  headers={
                      "apikey": key,
                      "Authorization": "Bearer " + key,
                      "Content-Type": "application/json",
                      "Accept": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=60) as response:
                      raw = response.read().decode("utf-8")
                      return None if raw == "" else json.loads(raw)
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", "replace")
                  raise SystemExit(
                      f"Supabase request failed: {method} {path} HTTP {exc.code}: {body}"
                  ) from None

          def get_rows(table, **params):
              query = urllib.parse.urlencode(params)
              return request("GET", f"/rest/v1/{table}?{query}")

          def rpc(name, **payload):
              return request("POST", f"/rest/v1/rpc/{name}", payload)

          # Fresh preflight: exact frozen source/stage, zero prior certificate/runtime.
          source = get_rows(
              "mls_sources",
              select="source_id,logical_source_id,content_sha256,size_bytes",
              source_id=f"eq.{SOURCE_ID}",
          )
          assert len(source) == 1, source
          assert source[0]["logical_source_id"] == LOGICAL, source
          assert source[0]["content_sha256"] == SOURCE_SHA, source
          assert source[0]["size_bytes"] == SOURCE_SIZE, source

          latest = get_rows(
              "mls_source_map_staging",
              select="staging_version,payload_sha256,toc_denominator,audit_metadata",
              logical_source_id=f"eq.{LOGICAL}",
              order="staging_version.desc",
              limit="1",
          )
          assert len(latest) == 1, latest
          stage = latest[0]
          assert stage["staging_version"] == STAGING_VERSION, stage
          assert stage["payload_sha256"] == STAGING_SHA, stage
          assert stage["toc_denominator"] == TOC_DENOMINATOR, stage

          logical = get_rows(
              "mls_logical_sources",
              select="source_map_version,promoted_staging_version,promoted_certificate_sha256",
              logical_source_id=f"eq.{LOGICAL}",
          )
          assert len(logical) == 1, logical
          assert logical[0]["source_map_version"] == EXPECTED_VERSION, logical
          assert logical[0]["promoted_staging_version"] is None, logical
          assert logical[0]["promoted_certificate_sha256"] is None, logical

          certs_before = get_rows(
              "mls_source_map_certificates",
              select="certificate_sha256",
              logical_source_id=f"eq.{LOGICAL}",
          )
          assert certs_before == [], certs_before

          runtime_before = get_rows(
              "mls_source_map_nodes",
              select="node_id",
              logical_source_id=f"eq.{LOGICAL}",
          )
          assert runtime_before == [], len(runtime_before)

          validator = rpc(
              "mls_validate_source_map_stage",
              p_logical_source_id=LOGICAL,
              p_staging_version=STAGING_VERSION,
          )
          assert validator == STAGING_SHA, validator

          print("PRECHECK_PASS")

          # Immutable certificate.
          certificate_sha = rpc(
              "mls_certify_source_map",
              p_logical_source_id=LOGICAL,
              p_staging_version=STAGING_VERSION,
              p_expected_staging_sha256=STAGING_SHA,
          )
          assert isinstance(certificate_sha, str) and len(certificate_sha) == 64, certificate_sha

          cert = get_rows(
              "mls_source_map_certificates",
              select="staging_version,staging_sha256,certificate_sha256,toc_denominator,audit_metadata",
              logical_source_id=f"eq.{LOGICAL}",
              staging_version=f"eq.{STAGING_VERSION}",
          )
          assert len(cert) == 1, cert
          cert = cert[0]
          assert cert["staging_version"] == STAGING_VERSION, cert
          assert cert["staging_sha256"] == STAGING_SHA, cert
          assert cert["certificate_sha256"] == certificate_sha, cert
          assert cert["toc_denominator"] == TOC_DENOMINATOR, cert
          assert cert["audit_metadata"] == stage["audit_metadata"], "certificate audit metadata mismatch"

          print("CERTIFICATE_PASS", certificate_sha)

          # Atomic single-book promotion guarded by expected runtime version.
          new_version = rpc(
              "mls_promote_source_map",
              p_logical_source_id=LOGICAL,
              p_staging_version=STAGING_VERSION,
              p_certificate_sha256=certificate_sha,
              p_expected_version=EXPECTED_VERSION,
          )
          assert new_version == 1, new_version

          # Post-promotion exact readback.
          logical_after = get_rows(
              "mls_logical_sources",
              select="source_map_version,promoted_staging_version,promoted_certificate_sha256",
              logical_source_id=f"eq.{LOGICAL}",
          )
          assert len(logical_after) == 1, logical_after
          logical_after = logical_after[0]
          assert logical_after["source_map_version"] == 1, logical_after
          assert logical_after["promoted_staging_version"] == STAGING_VERSION, logical_after
          assert logical_after["promoted_certificate_sha256"] == certificate_sha, logical_after

          runtime_after = get_rows(
              "mls_source_map_nodes",
              select="node_id,kind,page_end",
              logical_source_id=f"eq.{LOGICAL}",
              order="order_index.asc",
          )
          assert len(runtime_after) == EXPECTED_RUNTIME_NODES, len(runtime_after)
          assert len({n["node_id"] for n in runtime_after}) == EXPECTED_RUNTIME_NODES
          assert sum(1 for n in runtime_after if n["kind"] == "book") == 1
          assert all(n["page_end"] is None for n in runtime_after), "unexpected runtime page_end"

          runtime_match = rpc(
              "mls_runtime_matches_staging",
              p_logical_source_id=LOGICAL,
              p_staging_version=STAGING_VERSION,
          )
          assert runtime_match is True, runtime_match

          readiness = rpc(
              "mls_source_map_readiness",
              p_logical_source_id=LOGICAL,
          )
          assert readiness["audited_state"] == "ready_for_hoc90", readiness
          assert readiness["ready_for_hoc90"] is True, readiness
          assert readiness["current_version"] == 1, readiness
          assert readiness["staging_version"] == STAGING_VERSION, readiness
          assert readiness["promoted_staging_version"] == STAGING_VERSION, readiness

          print("PROMOTION_PASS")
          print("runtime_nodes", len(runtime_after))
          print("runtime_matches_staging", runtime_match)
          print("readiness", json.dumps(readiness, sort_keys=True))
          print("certificate_sha", certificate_sha)
          PY
