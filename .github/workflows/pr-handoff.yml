name: PR handoff

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
          # Run the validator from the trusted base, never PR code.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check issue, scope and change-specific evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/check_pr_handoff.py
