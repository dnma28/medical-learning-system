name: PR handoff

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check issue, scope and change-specific evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/check_pr_handoff.py
