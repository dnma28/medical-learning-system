name: Costanzo identity one-book apply

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/costanzo-identity-apply.yml
      - src/medical_learning_system/costanzo_identity_execution.py
      - config/identity/costanzo-identity-plan-v3.json

permissions:
  contents: read

concurrency:
  group: costanzo-identity-apply-once
  cancel-in-progress: false

jobs:
  owner-gated-one-book-apply:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install existing PostgreSQL driver extra
        run: pip install -e '.[postgres]'
      - name: Verify separate owner gate and apply exact one-book plan once
        env:
          MLS_SUPABASE_URL: ${{ secrets.MLS_SUPABASE_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: python -m medical_learning_system.costanzo_identity_execution
