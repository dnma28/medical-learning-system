name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: pip install -e '.[dev,fsrs,pdf-native]'
      - name: Run tests
        run: pytest -q
  postgres-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Start isolated Supabase database
        run: npx --yes supabase@2.117.0 start
      - name: Apply complete local migration chain
        run: npx --yes supabase@2.117.0 db reset --local
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test one-book identity transactions on isolated Postgres
        env:
          MLS_TEST_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          pip install -e '.[dev,postgres]'
          pytest -q tests/test_postgres_identity_correction.py tests/test_identity_backend_preflight.py tests/test_costanzo_identity_execution.py
      - name: Run Source Map promotion contract twice with rollback
        shell: bash
        run: |
          set -euo pipefail
          for run in 1 2; do
            { printf 'BEGIN;\n'; cat tests/sql/source_map_promotion_contract.sql; printf '\nROLLBACK;\n'; } \
              | psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' \
                  -v ON_ERROR_STOP=1
          done
  optional-tool-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install optional tools
        run: pip install -e '.[markitdown,langgraph]'
      - name: Verify local conversion and graph execution
        run: python scripts/check_optional_tools.py
